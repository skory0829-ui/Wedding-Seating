<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0F1D2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seating">
<title>Seating Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16283F; --navy-2:#20395A; --navy-3:#0F1D2F;
  --terra:#C2603F; --terra-lt:#E08B67;
  --olive:#6E7F4E; --olive-lt:#93A473;
  --cream:#F3ECDD; --cream-2:#FBF6EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Karla",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--navy-3); color:var(--cream);
  min-height:100vh; padding-bottom:calc(40px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.display{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit}

/* header */
.hdr{padding:calc(16px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(243,236,221,.12);
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-3) 100%);position:relative}
.hdr h1{margin:0;font-size:22px;line-height:1.1}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra-lt);margin-bottom:6px}
.counts{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.count{font-size:12px;color:rgba(243,236,221,.72)}
.count b{font-family:"Fraunces",Georgia,serif;font-size:17px;color:var(--cream);margin-right:4px}
.saveflag{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(243,236,221,.45)}

/* tabs */
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{flex:1;padding:9px 4px;border-radius:9px 9px 0 0;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:rgba(243,236,221,.55);background:rgba(243,236,221,.05)}
.tab.on{background:var(--cream);color:var(--navy)}

/* hall */
.hallwrap{padding:0 12px 12px}
.hall{background:var(--cream);border-radius:0 0 14px 14px;padding:12px 10px 14px;
  box-shadow:inset 0 0 0 1px rgba(22,40,63,.14)}
.headtable{display:block;width:100%;text-align:left;background:var(--navy);border-radius:10px;
  padding:9px 10px 11px;margin-bottom:12px;border:1px solid var(--navy-2)}
.htlabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.htname{font-family:"Fraunces",Georgia,serif;font-size:13px;color:var(--cream);font-weight:600}
.htcount{font-size:11px;color:var(--terra-lt);letter-spacing:.08em}
.htseats{display:flex;gap:5px;flex-wrap:wrap}
.htseat{flex:1 1 auto;min-width:26px;height:30px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:9.5px;line-height:1.05;text-align:center;overflow:hidden;
  padding:2px 3px;border:1px dashed rgba(243,236,221,.3);color:rgba(243,236,221,.4)}
.htseat.on{background:var(--terra);border:1px solid var(--terra);color:#fff;font-weight:600}

.floorrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.side{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.side{grid-template-columns:repeat(3,1fr)}}

.chip{position:relative;width:clamp(46px,13.5vw,72px);aspect-ratio:1;display:block;padding:0}
.disc{position:absolute;inset:17%;border-radius:50%;background:var(--cream-2);border:1.5px solid var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s ease}
.chip.full .disc{background:var(--olive);border-color:var(--olive)}
.chip.empty .disc{background:transparent;border-style:dashed;border-color:rgba(22,40,63,.4)}
.chip:active .disc{transform:scale(.92)}
.num{font-family:"Fraunces",Georgia,serif;font-size:clamp(12px,3.6vw,17px);font-weight:600;color:var(--navy);line-height:1}
.chip.full .num{color:var(--cream-2)}
.frac{font-size:8.5px;letter-spacing:.03em;color:rgba(22,40,63,.6);margin-top:1px}
.chip.full .frac{color:rgba(251,246,236,.85)}
.pip{position:absolute;width:15%;height:15%;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid rgba(22,40,63,.45);background:var(--cream)}
.pip.on{background:var(--terra);border-color:var(--terra)}

.dance{align-self:stretch;min-height:170px;border-radius:8px;border:1.5px solid rgba(110,127,78,.45);
  background:repeating-linear-gradient(45deg,rgba(110,127,78,.13) 0 7px,transparent 7px 14px),var(--cream-2);
  display:flex;align-items:center;justify-content:center;padding:6px}
.dance span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive);
  font-weight:700;writing-mode:vertical-rl;text-orientation:mixed}
@media(min-width:620px){.dance span{writing-mode:horizontal-tb}}

.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:rgba(22,40,63,.65)}
.lgdot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--navy)}

/* panels */
.panel{padding:14px 16px}
.card{background:rgba(243,236,221,.06);border:1px solid rgba(243,236,221,.12);border-radius:12px;
  padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:14px;font-family:"Fraunces",Georgia,serif;font-weight:600}
.hint{margin:0 0 10px;font-size:12px;line-height:1.5;color:rgba(243,236,221,.6)}
.field{width:100%;background:rgba(15,29,47,.6);border:1px solid rgba(243,236,221,.18);border-radius:9px;
  color:var(--cream);padding:11px 12px;font-size:16px}
.field:focus{outline:2px solid var(--terra);outline-offset:1px}
textarea.field{min-height:130px;resize:vertical;line-height:1.45;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;
  padding:11px 14px;font-size:13.5px;font-weight:700;letter-spacing:.03em}
.btn.primary{background:var(--terra);color:#fff}
.btn.olive{background:var(--olive);color:var(--cream-2)}
.btn.ghost{background:rgba(243,236,221,.09);color:var(--cream)}
.btn.danger{background:rgba(194,96,63,.16);color:var(--terra-lt);border:1px solid rgba(194,96,63,.4)}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.glist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.grow{display:flex;align-items:center;gap:10px;background:rgba(243,236,221,.05);
  border:1px solid rgba(243,236,221,.1);border-radius:10px;padding:10px 12px}
.gname{flex:1;font-size:14.5px;text-align:left;padding:0}
.gwhere{font-size:11px;color:var(--olive-lt);white-space:nowrap}
.gwhere.un{color:var(--terra-lt)}
.filters{display:flex;gap:6px;margin-top:10px}
.fbtn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;
  background:rgba(243,236,221,.06);color:rgba(243,236,221,.6)}
.fbtn.on{background:var(--cream);color:var(--navy)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,29,.72);display:flex;align-items:flex-end;z-index:40}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--navy);border-radius:18px 18px 0 0;
  border-top:3px solid var(--terra);padding:14px 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(243,236,221,.25);margin:0 auto 12px}
.sheethdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sname{flex:1;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600}
.x{width:34px;height:34px;border-radius:50%;background:rgba(243,236,221,.1);font-size:17px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:10px;justify-content:space-between;
  background:rgba(15,29,47,.55);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.stepper .lbl{font-size:12px;color:rgba(243,236,221,.65);letter-spacing:.05em;text-transform:uppercase}
.stepper .ctrl{display:flex;align-items:center;gap:12px}
.rnd{width:34px;height:34px;border-radius:50%;background:rgba(243,236,221,.12);font-size:19px;
  display:flex;align-items:center;justify-content:center;line-height:1}
.stepper .val{font-family:"Fraunces",Georgia,serif;font-size:19px;min-width:20px;text-align:center}
.seatlist{display:flex;flex-direction:column;gap:7px}
.seat{display:flex;align-items:center;gap:10px;border-radius:10px;padding:11px 12px;
  background:rgba(243,236,221,.05);border:1px solid rgba(243,236,221,.12)}
.seat.taken{background:rgba(110,127,78,.18);border-color:rgba(147,164,115,.45)}
.seatno{width:24px;height:24px;border-radius:50%;background:rgba(243,236,221,.12);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700}
.seat.taken .seatno{background:var(--olive);color:var(--cream-2)}
.seatname{flex:1;font-size:15px;text-align:left;padding:0}
.placeholder{color:rgba(243,236,221,.4);font-style:italic;font-size:14px}
.clr{font-size:11px;color:var(--terra-lt);padding:5px 8px;border-radius:6px;
  background:rgba(194,96,63,.18);flex:0 0 auto}
.plist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.pitem{text-align:left;padding:11px 12px;border-radius:9px;background:rgba(243,236,221,.06);
  font-size:14.5px;border:1px solid rgba(243,236,221,.1)}
.pitem small{display:block;font-size:10.5px;color:var(--olive-lt);margin-top:2px}
.empty{text-align:center;padding:22px 10px;font-size:13px;color:rgba(243,236,221,.45);line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--olive);
  color:var(--cream-2);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.linkbox{width:100%;font-size:11px;word-break:break-all;background:rgba(15,29,47,.6);
  border:1px solid rgba(243,236,221,.18);border-radius:9px;color:rgba(243,236,221,.8);padding:10px;
  margin-top:8px;max-height:90px;overflow-y:auto}
@media print{
  body{background:#fff;color:#000}
  .tabs,.hdr .saveflag,.scrim{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="eyebrow">Reception</div>
  <h1 class="display">Seating Chart</h1>
  <div class="saveflag" id="saveflag"></div>
  <div class="counts" id="counts"></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="hall">Hall</button>
  <button class="tab" data-tab="guests">Guests</button>
  <button class="tab" data-tab="setup">Setup</button>
</nav>

<main id="view"></main>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- constants + state ---------------- */
var KEY="wedding-seating-v1", MIN_SEATS=6, MAX_SEATS=9, HEAD_MIN=2, HEAD_MAX=16;
var ui={tab:"hall", query:"", filter:"all", raw:"", sheet:null, pickQuery:"", editingName:false};
var state=null, saveTimer=null;

function uid(p){return p+Math.random().toString(36).slice(2,9);}
function makeTable(n){return {id:uid("t"),name:"Table "+n,seats:8,people:[null,null,null,null,null,null,null,null]};}
function defaultState(){
  var t=[]; for(var i=0;i<18;i++) t.push(makeTable(i+1));
  return {v:1, rev:0, head:{id:"head",name:"Head Table",seats:8,people:[null,null,null,null,null,null,null,null]}, tables:t, guests:[]};
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------------- sync layer ---------------- */
var SKEY="wedding-seating-sync", DKEY="wedding-seating-device";
var sync={cfg:null,dirty:false,pushTimer:null,pollTimer:null,remoteRev:0,device:null,busy:false};

function setFlag(t){var e=document.getElementById("saveflag"); if(e) e.textContent=t;}
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }

function deviceId(){
  if(!sync.device){
    sync.device=lsGet(DKEY);
    if(!sync.device){ sync.device=uid("d"); lsSet(DKEY,sync.device); }
  }
  return sync.device;
}
function loadCfg(){ var r=lsGet(SKEY); try{ return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveCfg(c){ sync.cfg=c; _adKey=""; if(c) lsSet(SKEY,JSON.stringify(c)); else lsDel(SKEY); }

/* --- Supabase adapter --- */
function supaAdapter(cfg){
  var base=String(cfg.url||"").replace(/\/+$/,"");
  var h={apikey:cfg.key,Authorization:"Bearer "+cfg.key,"Content-Type":"application/json"};
  return {
    get:function(){
      return fetch(base+"/rest/v1/seating_charts?id=eq."+encodeURIComponent(cfg.id)+"&select=payload",{headers:h,cache:"no-store"})
        .then(function(r){
          if(!r.ok) return r.text().then(function(t){ throw new Error("Supabase "+r.status+": "+t.slice(0,140)); });
          return r.json();
        })
        .then(function(rows){ return (rows&&rows[0])?rows[0].payload:null; });
    },
    put:function(env){
      var hh=Object.assign({},h,{Prefer:"resolution=merge-duplicates,return=minimal"});
      return fetch(base+"/rest/v1/seating_charts",{method:"POST",headers:hh,
        body:JSON.stringify([{id:cfg.id,payload:env}])})
        .then(function(r){
          if(!r.ok) return r.text().then(function(t){ throw new Error("Supabase "+r.status+": "+t.slice(0,140)); });
        });
    }
  };
}

/* --- GitHub adapter --- */
function ghAdapter(cfg){
  var api="https://api.github.com/repos/"+cfg.repo+"/contents/"+cfg.path;
  var branch=cfg.branch||"main";
  var h={Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  var sha=null;
  function get(){
    return fetch(api+"?ref="+encodeURIComponent(branch)+"&_="+Date.now(),{headers:h,cache:"no-store"})
      .then(function(r){
        if(r.status===404){ sha=null; return null; }
        if(!r.ok) return r.text().then(function(t){ throw new Error("GitHub "+r.status+": "+t.slice(0,140)); });
        return r.json().then(function(j){
          sha=j.sha;
          try{
            return JSON.parse(decodeURIComponent(escape(atob(String(j.content||"").replace(/\s/g,"")))));
          }catch(e){ return null; }
        });
      });
  }
  function put(env,retry){
    var body={message:"Seating chart update",branch:branch,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(env))))};
    if(sha) body.sha=sha;
    return fetch(api,{method:"PUT",headers:Object.assign({},h,{"Content-Type":"application/json"}),body:JSON.stringify(body)})
      .then(function(r){
        if(r.ok) return r.json().then(function(j){ if(j&&j.content) sha=j.content.sha; });
        if((r.status===409||r.status===422)&&!retry) return get().then(function(){ return put(env,true); });
        return r.text().then(function(t){ throw new Error("GitHub "+r.status+": "+t.slice(0,140)); });
      });
  }
  return {get:get,put:put};
}

var _ad=null,_adKey="";
function adapter(){
  if(!sync.cfg||!sync.cfg.kind) return null;
  var k=JSON.stringify(sync.cfg);
  if(k!==_adKey){ _adKey=k; _ad = sync.cfg.kind==="github"?ghAdapter(sync.cfg):supaAdapter(sync.cfg); }
  return _ad;
}
function syncOn(){ return !!adapter(); }

function pushNow(){
  var a=adapter(); if(!a) return Promise.resolve();
  sync.busy=true; setFlag("syncing");
  state.rev=Math.max(state.rev||0,sync.remoteRev||0)+1;
  var env={rev:state.rev,at:Date.now(),by:deviceId(),data:state};
  return a.put(env).then(function(){
    sync.remoteRev=env.rev; sync.dirty=false; sync.busy=false;
    saveLocal(); setFlag("synced");
  }).catch(function(e){
    sync.busy=false; setFlag("saved on this phone");
    console.warn(e);
  });
}
function pull(){
  var a=adapter(); if(!a||sync.dirty||sync.busy||ui.sheet) return;
  a.get().then(function(env){
    if(!env||!env.data) return;
    sync.remoteRev=Math.max(sync.remoteRev||0,env.rev||0);
    if(env.by===deviceId()||(env.rev||0)<=(state.rev||0)) return;
    state=env.data; state.rev=env.rev;
    saveLocal(); render(); setFlag("synced");
    toast("Updated from another phone");
  }).catch(function(e){ setFlag("offline"); console.warn(e); });
}
function startSync(){
  clearInterval(sync.pollTimer);
  if(!syncOn()){ setFlag("saved"); return; }
  pull();
  sync.pollTimer=setInterval(pull,7000);
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) pull(); });

/* ---------------- persistence ---------------- */
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
}
function save(){
  sync.dirty=true;
  clearTimeout(saveTimer);
  setFlag("saving");
  saveTimer=setTimeout(function(){
    saveLocal();
    if(syncOn()){ clearTimeout(sync.pushTimer); sync.pushTimer=setTimeout(pushNow,700); }
    else setFlag("saved");
  },350);
}

function load(){
  sync.cfg=loadCfg();
  var link=readLink();
  if(link&&link.state){
    var existing=lsGet(KEY);
    var msg = link.cfg
      ? "Connect this phone to the shared seating chart?"
      : "Open the shared chart? This replaces the copy saved on this device.";
    var ok = (!existing && !link.cfg) || confirm(msg);
    history.replaceState(null,"",location.pathname+location.search);
    if(ok){
      state=link.state;
      if(link.cfg) saveCfg(link.cfg);
      saveLocal();
      return;
    }
  }
  var raw=lsGet(KEY);
  if(raw){
    try{ var p=JSON.parse(raw); if(p&&p.tables){ state=p; return; } }catch(e){}
  }
  state=defaultState();
}

/* ---------------- share link ---------------- */
function packTable(t){
  return [t.name, t.seats].concat(t.people.map(function(p){ return p?(guestName(p)||""):""; }));
}
function unpackTable(a,id){
  var name=a[0], seats=a[1], names=a.slice(2,2+seats), people=[];
  while(names.length<seats) names.push("");
  return {id:id||uid("t"), name:name, seats:seats, names:names};
}
function encodePayload(withCfg){
  var sm=seatMap();
  var loose=state.guests.filter(function(g){return !sm[g.id];}).map(function(g){return g.name;});
  var compact=[1, packTable(state.head), state.tables.map(packTable), loose];
  var obj = withCfg ? [2, sync.cfg||null, compact] : compact;
  var json=JSON.stringify(obj);
  return (withCfg?"s=":"c=")+encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
}
function encodeState(){ return encodePayload(false); }
function decodeCompact(p){
  var guests=[], byName={};
  function gid(n){
    if(!n) return null;
    var k=n.toLowerCase();
    if(!byName[k]){ var g={id:uid("g"),name:n}; guests.push(g); byName[k]=g.id; }
    return byName[k];
  }
  function build(raw,id){
    var t=unpackTable(raw,id);
    return {id:t.id,name:t.name,seats:t.seats,people:t.names.map(function(n){return gid(n);})};
  }
  var head=build(p[1],"head");
  var tables=p[2].map(function(r){ return build(r); });
  (p[3]||[]).forEach(gid);
  return {v:1,rev:0,head:head,tables:tables,guests:guests};
}
function readLink(){
  var h=location.hash.replace(/^#/,"");
  var mode=h.slice(0,2);
  if(mode!=="c="&&mode!=="b="&&mode!=="s=") return null;
  try{
    var json=decodeURIComponent(escape(atob(decodeURIComponent(h.slice(2)))));
    var p=JSON.parse(json);
    if(mode==="b=") return (p&&p.tables)?{state:p,cfg:null}:null;
    if(mode==="s=") return (p&&p[0]===2)?{state:decodeCompact(p[2]),cfg:p[1]||null}:null;
    return (p&&p[0]===1)?{state:decodeCompact(p),cfg:null}:null;
  }catch(e){ return null; }
}

/* ---------------- derived ---------------- */
function allTables(){ return [state.head].concat(state.tables); }
function guestName(id){ for(var i=0;i<state.guests.length;i++) if(state.guests[i].id===id) return state.guests[i].name; return null; }
function seatMap(){
  var m={}, ts=allTables();
  for(var i=0;i<ts.length;i++) for(var j=0;j<ts[i].people.length;j++){
    var p=ts[i].people[j]; if(p) m[p]={tableId:ts[i].id, tableName:ts[i].name, idx:j};
  }
  return m;
}
function tableById(id){ var ts=allTables(); for(var i=0;i<ts.length;i++) if(ts[i].id===id) return ts[i]; return null; }

/* ---------------- mutations ---------------- */
function updateTable(id,fn){
  if(id==="head"){ state.head=fn(state.head); }
  else { state.tables=state.tables.map(function(t){return t.id===id?fn(t):t;}); }
  save();
}
function setSeatCount(id,n){
  updateTable(id,function(t){
    var people=t.people.slice(0,n);
    while(people.length<n) people.push(null);
    return Object.assign({},t,{seats:n,people:people});
  });
}
function clearSeat(id,idx){
  updateTable(id,function(t){ var p=t.people.slice(); p[idx]=null; return Object.assign({},t,{people:p}); });
}
function assign(tableId,idx,gid){
  function strip(t){ return Object.assign({},t,{people:t.people.map(function(p){return p===gid?null:p;})}); }
  function place(t){ var p=t.people.slice(); p[idx]=gid; return Object.assign({},t,{people:p}); }
  state.head = tableId==="head" ? place(strip(state.head)) : strip(state.head);
  state.tables = state.tables.map(function(t){ return t.id===tableId ? place(strip(t)) : strip(t); });
  save();
}
function addGuests(names){
  var have={}; state.guests.forEach(function(g){have[g.name.toLowerCase()]=1;});
  var added=0;
  names.forEach(function(n){ if(!have[n.toLowerCase()]){ state.guests.push({id:uid("g"),name:n}); have[n.toLowerCase()]=1; added++; } });
  save(); return added;
}
function addOneGuest(name){ var g={id:uid("g"),name:name}; state.guests.push(g); save(); return g.id; }
function removeGuest(id){
  state.guests=state.guests.filter(function(g){return g.id!==id;});
  state.head.people=state.head.people.map(function(p){return p===id?null:p;});
  state.tables=state.tables.map(function(t){return Object.assign({},t,{people:t.people.map(function(p){return p===id?null:p;})});});
  save();
}

/* ---------------- name parsing ---------------- */
function parseNames(raw){
  var lines=raw.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean)
    .map(function(l){return l.replace(/^\s*(\d+[.)]|[-•*])\s+/,"");});
  var withComma=lines.filter(function(l){return l.indexOf(",")>-1;}).length;
  var csv = lines.length>1 && withComma >= lines.length*0.7;
  var out=lines.map(function(l){
    if(!csv) return l;
    var c=l.split(",").map(function(x){return x.trim().replace(/^"|"$/g,"");});
    return ((c[0]||"")+" "+(c[1]||"")).trim();
  });
  if(out.length && /^(first\s*name|name|guest|full\s*name)\b/i.test(out[0])) out=out.slice(1);
  var seen={},res=[];
  out.forEach(function(n){
    n=n.replace(/\s+/g," ").trim();
    if(!n||n.length>60) return;
    var k=n.toLowerCase(); if(seen[k]) return; seen[k]=1; res.push(n);
  });
  return res;
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  var tab=e.target.closest("[data-tab]");
  if(tab){ ui.tab=tab.dataset.tab; render(); return; }
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var a=el.dataset.act, id=el.dataset.id, i=parseInt(el.dataset.i,10);

  if(a==="scrim" && e.target!==el) return;

  switch(a){
    case "table": openSheet({kind:"table",id:id}); break;
    case "scrim": case "closesheet":
      if(ui.sheet&&ui.sheet.kind==="seat"){ openSheet({kind:"table",id:ui.sheet.tableId}); }
      else { ui.sheet=null; renderSheet(); render(); }
      break;
    case "rename": ui.editingName=true; ui.focusField=true; renderSheet(); break;
    case "seats": {
      var t=tableById(ui.sheet.id), isHead=t.id==="head";
      var n=t.seats+parseInt(el.dataset.d,10);
      n=Math.max(isHead?HEAD_MIN:MIN_SEATS,Math.min(isHead?HEAD_MAX:MAX_SEATS,n));
      var dropped=t.people.slice(n).filter(Boolean).map(function(p){return guestName(p)||"someone";});
      if(dropped.length && !confirm("Removing that seat unseats "+dropped.join(" and ")+". Continue?")) break;
      setSeatCount(t.id,n);
      if(dropped.length) toast(dropped.join(" and ")+" moved back to the guest list");
      renderSheet(); renderCounts(); break;
    }
    case "seat": ui.sheet={kind:"seat",tableId:ui.sheet.id,idx:i}; ui.pickQuery=""; renderSheet(); break;
    case "clearseat": clearSeat(ui.sheet.id,i); renderSheet(); renderCounts(); break;
    case "choose": assign(ui.sheet.tableId,ui.sheet.idx,id); openSheet({kind:"table",id:ui.sheet.tableId}); renderCounts(); break;
    case "createguest": {
      var gid=addOneGuest(ui.pickQuery.trim());
      assign(ui.sheet.tableId,ui.sheet.idx,gid);
      openSheet({kind:"table",id:ui.sheet.tableId}); renderCounts(); break;
    }
    case "assign": openSheet({kind:"assign",guestId:id}); break;
    case "tochoose": {
      var tt=tableById(id), idx=tt.people.indexOf(null);
      if(idx===-1) break;
      assign(id,idx,ui.sheet.guestId); ui.sheet=null; renderSheet(); render(); toast("Seated at "+tt.name); break;
    }
    case "rmguest": removeGuest(id); document.getElementById("glist").innerHTML=guestListHTML(); renderCounts(); break;
    case "filter": ui.filter=el.dataset.v; render(); break;
    case "addone": {
      var inp=document.getElementById("newname"), v=inp.value.trim();
      if(!v) break;
      addGuests([v]); inp.value=""; render(); toast("Added "+v); break;
    }
    case "addbulk": {
      var names=parseNames(ui.raw);
      if(!names.length){ toast("Nothing to add"); break; }
      var added=addGuests(names); ui.raw=""; render(); toast("Added "+added+" guests"); break;
    }
    case "tablecount": {
      var d=parseInt(el.dataset.d,10), cur=state.tables.length, want=Math.max(2,Math.min(40,cur+d));
      if(want>cur){ for(var k=cur;k<want;k++) state.tables.push(makeTable(k+1)); }
      else { state.tables=state.tables.slice(0,want); }
      save(); render(); break;
    }
    case "alleight": {
      state.tables=state.tables.map(function(t){
        var p=t.people.slice(0,8); while(p.length<8) p.push(null);
        return Object.assign({},t,{seats:8,people:p});
      });
      save(); render(); toast("All tables set to 8"); break;
    }
    case "synckind": ui.syncKind=el.dataset.v; render(); break;
    case "connectsync": {
      var cfg=readSyncForm();
      var missing = cfg.kind==="github" ? (!cfg.repo||!cfg.token) : (!cfg.url||!cfg.key);
      if(missing){ syncMsg('<p class="hint" style="color:#E08B67">Fill in every field first.</p>'); break; }
      if(cfg.kind==="github" && cfg.repo.split("/").length!==2){
        syncMsg('<p class="hint" style="color:#E08B67">Repository should look like yourname/wedding-seating.</p>'); break;
      }
      syncMsg('<p class="hint">Testing the connection…</p>');
      var prev=sync.cfg;
      saveCfg(cfg);
      var a=adapter();
      a.get().then(function(env){
        if(env&&env.data){
          sync.remoteRev=env.rev||0;
          if(confirm("There is already a chart on the backend. Use it and replace what is on this phone?")){
            state=env.data; state.rev=env.rev||0; saveLocal();
          } else {
            sync.dirty=true; return pushNow();
          }
        } else {
          return pushNow();
        }
      }).then(function(){
        startSync(); render();
        syncMsg('<p class="hint" style="color:#93A473">Connected. Send her the setup link and you are both on the same chart.</p>');
      }).catch(function(e){
        saveCfg(prev||null); render();
        syncMsg('<p class="hint" style="color:#E08B67">Could not connect. '+esc(String(e.message||e))+'</p>');
      });
      break;
    }
    case "setuplink": {
      var surl=location.origin+location.pathname+location.search+"#"+encodePayload(true);
      if(navigator.share) navigator.share({title:"Seating chart setup",url:surl}).catch(function(){});
      copyText(surl,function(ok){
        syncMsg(ok?'<p class="hint" style="color:#93A473">Setup link copied. Send it to her directly.</p>'
                 :'<div class="linkbox">'+esc(surl)+'</div>');
        if(ok) toast("Setup link copied");
      });
      break;
    }
    case "disconnect": {
      if(!confirm("Disconnect this phone? The chart stays here but stops syncing.")) break;
      clearInterval(sync.pollTimer); saveCfg(null); render(); setFlag("saved"); toast("Disconnected");
      break;
    }
    case "sharelink": {
      var url=location.origin+location.pathname+location.search+"#"+encodeState();
      var out=document.getElementById("linkout");
      if(navigator.share){
        navigator.share({title:"Seating chart",url:url}).catch(function(){});
      }
      copyText(url,function(ok){
        out.innerHTML=ok?"":'<div class="linkbox">'+esc(url)+'</div><p class="hint" style="margin-top:6px">Copy failed — long-press the link above to select it.</p>';
        if(ok) toast("Share link copied");
      });
      break;
    }
    case "copylist": {
      var text=allTables().map(function(t){
        var rows=t.people.map(function(p,ix){return "  "+(ix+1)+". "+(p?(guestName(p)||""):"—");}).join("\n");
        return t.name+" ("+t.people.filter(Boolean).length+"/"+t.seats+")\n"+rows;
      }).join("\n\n");
      copyText(text,function(ok){ toast(ok?"Seating list copied":"Copy failed"); });
      break;
    }
    case "download": {
      var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      var link=document.createElement("a");
      link.href=URL.createObjectURL(blob);
      link.download="seating-chart-backup.json";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      break;
    }
    case "importbtn": document.getElementById("importfile").click(); break;
    case "clearall": {
      if(!confirm("Clear all guests and seat assignments?")) break;
      state.guests=[];
      state.head.people=state.head.people.map(function(){return null;});
      state.tables=state.tables.map(function(t){return Object.assign({},t,{people:t.people.map(function(){return null;})});});
      save(); render(); toast("Chart cleared"); break;
    }
  }
});

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="gsearch"){ ui.query=t.value; document.getElementById("glist").innerHTML=guestListHTML(); }
  else if(t.id==="psearch"){
    ui.pickQuery=t.value; ui.focusField=true; renderSheet();
  }
  else if(t.id==="bulk"){
    ui.raw=t.value;
    var p=ui.raw.trim()?parseNames(ui.raw):[];
    document.getElementById("bulkinfo").textContent = p.length?("Reading "+p.length+" names, starting with "+p.slice(0,3).join(", ")+(p.length>3?"…":"")):"";
  }
});
document.addEventListener("change",function(e){
  if(e.target.id!=="importfile") return;
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if(!p||!p.tables) throw 0;
      if(!confirm("Load this backup? It replaces the chart on this phone.")) return;
      state=p; save(); render(); toast("Backup loaded");
    }catch(err){ toast("That file could not be read"); }
  };
  r.readAsText(f);
  e.target.value="";
});
document.addEventListener("blur",function(e){
  if(e.target.id==="tname" && ui.sheet && ui.sheet.kind==="table"){
    var v=e.target.value.trim();
    if(v) updateTable(ui.sheet.id,function(t){return Object.assign({},t,{name:v});});
    ui.editingName=false; renderSheet(); render();
  }
},true);

function copyText(text,cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){cb(true);},function(){fallback();});
  } else fallback();
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      var ok=document.execCommand("copy");
      document.body.removeChild(ta); cb(ok);
    }catch(e){ cb(false); }
  }
}

/* ---------------- go ---------------- */
load();
render();
startSync();
if(!syncOn()) setFlag("saved");
</script>
</body>
</html>
