<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0F1D2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seating">
<title>Seating Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16283F; --navy-2:#20395A; --navy-3:#0F1D2F;
  --terra:#C2603F; --terra-lt:#E08B67;
  --olive:#6E7F4E; --olive-lt:#93A473;
  --cream:#F3ECDD; --cream-2:#FBF6EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Karla",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--navy-3); color:var(--cream);
  min-height:100vh; padding-bottom:calc(40px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.display{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit}

/* header */
.hdr{padding:calc(16px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(243,236,221,.12);
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-3) 100%);position:relative}
.hdr h1{margin:0;font-size:22px;line-height:1.1}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra-lt);margin-bottom:6px}
.counts{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.count{font-size:12px;color:rgba(243,236,221,.72)}
.count b{font-family:"Fraunces",Georgia,serif;font-size:17px;color:var(--cream);margin-right:4px}
.saveflag{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(243,236,221,.45)}

/* tabs */
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{flex:1;padding:9px 4px;border-radius:9px 9px 0 0;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:rgba(243,236,221,.55);background:rgba(243,236,221,.05)}
.tab.on{background:var(--cream);color:var(--navy)}

/* hall */
.hallwrap{padding:0 12px 12px;max-width:780px;margin:0 auto}
.hall{background:var(--cream);border-radius:0 0 14px 14px;padding:10px 10px 14px;
  box-shadow:inset 0 0 0 1px rgba(22,40,63,.14);container-type:inline-size}

/* the room: everything is placed in cqw units, so 1 unit = 1% of the room's width */
.room{position:relative;width:100%;border-radius:8px;background:var(--cream);
  box-shadow:inset 0 0 0 1px rgba(22,40,63,.12)}
.room.edit{background-color:var(--cream-2);
  background-image:radial-gradient(rgba(22,40,63,.18) 1px,transparent 1.3px);background-size:5cqw 5cqw}
.it{position:absolute;display:block;padding:0;margin:0}
.body{position:absolute;display:flex;align-items:center;justify-content:center;gap:.8cqw;overflow:hidden;
  background:var(--cream-2);border:1.5px solid var(--navy);color:var(--navy);transition:transform .12s ease}
.body.col{flex-direction:column;gap:0}
.it.round .body{border-radius:50%}
.it.long .body{border-radius:.9cqw}
.it.full .body{background:var(--olive);border-color:var(--olive);color:var(--cream-2)}
.it.empty .body{background:transparent;border-style:dashed;border-color:rgba(22,40,63,.4)}
.it.head .body{background:var(--navy);border:1.5px solid var(--navy);color:var(--cream)}
.it:active .body{transform:scale(.94)}
.room.edit .it:active .body{transform:none}
.ln{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:max(10px,3.1cqw);line-height:1;white-space:nowrap}
.lf{font-size:max(7.5px,1.9cqw);letter-spacing:.03em;opacity:.72;white-space:nowrap;line-height:1.15}
.it.head .ln{font-size:max(9px,2.4cqw)}
.it.head .lf{color:var(--terra-lt);opacity:1}
.pip{position:absolute;width:2cqw;height:2cqw;min-width:6px;min-height:6px;transform:translate(-50%,-50%);
  border-radius:50%;border:1.5px solid rgba(22,40,63,.45);background:var(--cream)}
.pip.on{background:var(--terra);border-color:var(--terra)}

.dancefl{position:absolute;border-radius:1.2cqw;border:1.5px solid rgba(110,127,78,.45);
  background:repeating-linear-gradient(45deg,rgba(110,127,78,.13) 0 7px,transparent 7px 14px),var(--cream-2);
  display:flex;align-items:center;justify-content:center}
.mark{position:absolute;border-radius:1cqw;border:1.5px dashed rgba(194,96,63,.55);background:rgba(194,96,63,.08);
  display:flex;align-items:center;justify-content:center}
.lbl{font-size:max(8px,2cqw);letter-spacing:.18em;text-transform:uppercase;color:var(--olive);font-weight:700;
  text-align:center;line-height:1.2;padding:2px;overflow:hidden;max-width:100%;max-height:100%}
.lbl.v{writing-mode:vertical-rl;text-orientation:mixed}
.mark .lbl{color:var(--terra);letter-spacing:.1em}
.room.edit .it,.room.edit .dancefl,.room.edit .mark{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.room.edit .it::after{content:"";position:absolute;inset:-.5cqw;border:1px dashed rgba(22,40,63,.35);
  border-radius:1.4cqw;pointer-events:none}
.room.edit .it.round::after{border-radius:50%}
.room.edit .it.clash::after{border:2px solid var(--terra)}
.room.edit .dancefl.clash,.room.edit .mark.clash{outline:2px solid var(--terra);outline-offset:2px}
.dragging{z-index:6;opacity:.88;cursor:grabbing}
.knob{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:var(--terra);
  border:2px solid var(--cream-2);box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:none;z-index:2}
.knob::before{content:"";position:absolute;inset:-10px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tools .sp{flex:1}
.tbtn{padding:8px 11px;border-radius:8px;background:var(--navy);color:var(--cream);font-size:12px;font-weight:700;letter-spacing:.02em}
.tbtn.terra{background:var(--terra);color:#fff}
.tbtn.soft{background:rgba(22,40,63,.09);color:var(--navy)}
.tbtn:disabled{opacity:.35}
.ehint{font-size:11.5px;line-height:1.45;color:rgba(22,40,63,.68);margin:0 0 8px}
.ehint b{color:var(--terra)}
.sub{margin:14px 0 6px;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:rgba(243,236,221,.55)}

.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:rgba(22,40,63,.65)}
.lgdot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--navy)}

/* panels */
.panel{padding:14px 16px}
.card{background:rgba(243,236,221,.06);border:1px solid rgba(243,236,221,.12);border-radius:12px;
  padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:14px;font-family:"Fraunces",Georgia,serif;font-weight:600}
.hint{margin:0 0 10px;font-size:12px;line-height:1.5;color:rgba(243,236,221,.6)}
.field{width:100%;background:rgba(15,29,47,.6);border:1px solid rgba(243,236,221,.18);border-radius:9px;
  color:var(--cream);padding:11px 12px;font-size:16px}
.field:focus{outline:2px solid var(--terra);outline-offset:1px}
textarea.field{min-height:130px;resize:vertical;line-height:1.45;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;
  padding:11px 14px;font-size:13.5px;font-weight:700;letter-spacing:.03em}
.btn.primary{background:var(--terra);color:#fff}
.btn.olive{background:var(--olive);color:var(--cream-2)}
.btn.ghost{background:rgba(243,236,221,.09);color:var(--cream)}
.btn.danger{background:rgba(194,96,63,.16);color:var(--terra-lt);border:1px solid rgba(194,96,63,.4)}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.glist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.grow{display:flex;align-items:center;gap:10px;background:rgba(243,236,221,.05);
  border:1px solid rgba(243,236,221,.1);border-radius:10px;padding:10px 12px}
.gname{flex:1;font-size:14.5px;text-align:left;padding:0}
.gwhere{font-size:11px;color:var(--olive-lt);white-space:nowrap}
.gwhere.un{color:var(--terra-lt)}
.filters{display:flex;gap:6px;margin-top:10px}
.fbtn{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;
  background:rgba(243,236,221,.06);color:rgba(243,236,221,.6)}
.fbtn.on{background:var(--cream);color:var(--navy)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,29,.72);display:flex;align-items:flex-end;z-index:40}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--navy);border-radius:18px 18px 0 0;
  border-top:3px solid var(--terra);padding:14px 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(243,236,221,.25);margin:0 auto 12px}
.sheethdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sname{flex:1;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600}
.x{width:34px;height:34px;border-radius:50%;background:rgba(243,236,221,.1);font-size:17px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:10px;justify-content:space-between;
  background:rgba(15,29,47,.55);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.stepper .lbl{font-size:12px;color:rgba(243,236,221,.65);letter-spacing:.05em;text-transform:uppercase}
.stepper .ctrl{display:flex;align-items:center;gap:12px}
.rnd{width:34px;height:34px;border-radius:50%;background:rgba(243,236,221,.12);font-size:19px;
  display:flex;align-items:center;justify-content:center;line-height:1}
.stepper .val{font-family:"Fraunces",Georgia,serif;font-size:19px;min-width:20px;text-align:center}
.seatlist{display:flex;flex-direction:column;gap:7px}
.seat{display:flex;align-items:center;gap:10px;border-radius:10px;padding:11px 12px;
  background:rgba(243,236,221,.05);border:1px solid rgba(243,236,221,.12)}
.seat.taken{background:rgba(110,127,78,.18);border-color:rgba(147,164,115,.45)}
.seatno{width:24px;height:24px;border-radius:50%;background:rgba(243,236,221,.12);font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700}
.seat.taken .seatno{background:var(--olive);color:var(--cream-2)}
.seatname{flex:1;font-size:15px;text-align:left;padding:0}
.placeholder{color:rgba(243,236,221,.4);font-style:italic;font-size:14px}
.clr{font-size:11px;color:var(--terra-lt);padding:5px 8px;border-radius:6px;
  background:rgba(194,96,63,.18);flex:0 0 auto}
.plist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.pitem{text-align:left;padding:11px 12px;border-radius:9px;background:rgba(243,236,221,.06);
  font-size:14.5px;border:1px solid rgba(243,236,221,.1)}
.pitem small{display:block;font-size:10.5px;color:var(--olive-lt);margin-top:2px}
.empty{text-align:center;padding:22px 10px;font-size:13px;color:rgba(243,236,221,.45);line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--olive);
  color:var(--cream-2);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.linkbox{width:100%;font-size:11px;word-break:break-all;background:rgba(15,29,47,.6);
  border:1px solid rgba(243,236,221,.18);border-radius:9px;color:rgba(243,236,221,.8);padding:10px;
  margin-top:8px;max-height:90px;overflow-y:auto}
@media print{
  body{background:#fff;color:#000}
  .tabs,.hdr .saveflag,.scrim{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="eyebrow">Reception</div>
  <h1 class="display">Seating Chart</h1>
  <div class="saveflag" id="saveflag"></div>
  <div class="counts" id="counts"></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="hall">Hall</button>
  <button class="tab" data-tab="guests">Guests</button>
  <button class="tab" data-tab="setup">Setup</button>
</nav>

<main id="view"></main>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ---------------- constants + state ---------------- */
var KEY="wedding-seating-v1", MIN_SEATS=6, MAX_SEATS=9, HEAD_MIN=2, HEAD_MAX=20, LONG_MIN=4, LONG_MAX=24;
var ui={tab:"hall", query:"", filter:"all", raw:"", sheet:null, pickQuery:"", editingName:false, edit:false, undo:[]};
var state=null, saveTimer=null, drag=null;

function uid(p){return p+Math.random().toString(36).slice(2,9);}
function makeTable(n,shape){return {id:uid("t"),name:"Table "+n,seats:8,people:[null,null,null,null,null,null,null,null],shape:shape||"round",rot:0};}
function nextTableNum(){
  var mx=0;
  state.tables.forEach(function(t){ var m=/(\d+)\s*$/.exec(t.name); if(m) mx=Math.max(mx,+m[1]); });
  return Math.max(mx,state.tables.length)+1;
}
function defaultState(){
  var t=[]; for(var i=0;i<18;i++) t.push(makeTable(i+1));
  return {v:1, rev:0, head:{id:"head",name:"Head Table",seats:8,people:[null,null,null,null,null,null,null,null]}, tables:t, guests:[]};
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------------- sync layer ---------------- */
var SKEY="wedding-seating-sync", DKEY="wedding-seating-device";
var sync={cfg:null,dirty:false,pushTimer:null,pollTimer:null,remoteRev:0,device:null,busy:false};

function setFlag(t){var e=document.getElementById("saveflag"); if(e) e.textContent=t;}
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }

function deviceId(){
  if(!sync.device){
    sync.device=lsGet(DKEY);
    if(!sync.device){ sync.device=uid("d"); lsSet(DKEY,sync.device); }
  }
  return sync.device;
}
function loadCfg(){ var r=lsGet(SKEY); try{ return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveCfg(c){ sync.cfg=c; _adKey=""; if(c) lsSet(SKEY,JSON.stringify(c)); else lsDel(SKEY); }

/* --- Supabase adapter --- */
function supaAdapter(cfg){
  var base=String(cfg.url||"").replace(/\/+$/,"");
  var h={apikey:cfg.key,Authorization:"Bearer "+cfg.key,"Content-Type":"application/json"};
  return {
    get:function(){
      return fetch(base+"/rest/v1/seating_charts?id=eq."+encodeURIComponent(cfg.id)+"&select=payload",{headers:h,cache:"no-store"})
        .then(function(r){
          if(!r.ok) return r.text().then(function(t){ throw new Error("Supabase "+r.status+": "+t.slice(0,140)); });
          return r.json();
        })
        .then(function(rows){ return (rows&&rows[0])?rows[0].payload:null; });
    },
    put:function(env){
      var hh=Object.assign({},h,{Prefer:"resolution=merge-duplicates,return=minimal"});
      return fetch(base+"/rest/v1/seating_charts",{method:"POST",headers:hh,
        body:JSON.stringify([{id:cfg.id,payload:env}])})
        .then(function(r){
          if(!r.ok) return r.text().then(function(t){ throw new Error("Supabase "+r.status+": "+t.slice(0,140)); });
        });
    }
  };
}

/* --- GitHub adapter --- */
function ghAdapter(cfg){
  var api="https://api.github.com/repos/"+cfg.repo+"/contents/"+cfg.path;
  var branch=cfg.branch||"main";
  var h={Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  var sha=null;
  function get(){
    return fetch(api+"?ref="+encodeURIComponent(branch)+"&_="+Date.now(),{headers:h,cache:"no-store"})
      .then(function(r){
        if(r.status===404){ sha=null; return null; }
        if(!r.ok) return r.text().then(function(t){ throw new Error("GitHub "+r.status+": "+t.slice(0,140)); });
        return r.json().then(function(j){
          sha=j.sha;
          try{
            return JSON.parse(decodeURIComponent(escape(atob(String(j.content||"").replace(/\s/g,"")))));
          }catch(e){ return null; }
        });
      });
  }
  function put(env,retry){
    var body={message:"Seating chart update",branch:branch,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(env))))};
    if(sha) body.sha=sha;
    return fetch(api,{method:"PUT",headers:Object.assign({},h,{"Content-Type":"application/json"}),body:JSON.stringify(body)})
      .then(function(r){
        if(r.ok) return r.json().then(function(j){ if(j&&j.content) sha=j.content.sha; });
        if((r.status===409||r.status===422)&&!retry) return get().then(function(){ return put(env,true); });
        return r.text().then(function(t){ throw new Error("GitHub "+r.status+": "+t.slice(0,140)); });
      });
  }
  return {get:get,put:put};
}

var _ad=null,_adKey="";
function adapter(){
  if(!sync.cfg||!sync.cfg.kind) return null;
  var k=JSON.stringify(sync.cfg);
  if(k!==_adKey){ _adKey=k; _ad = sync.cfg.kind==="github"?ghAdapter(sync.cfg):supaAdapter(sync.cfg); }
  return _ad;
}
function syncOn(){ return !!adapter(); }

function pushNow(){
  var a=adapter(); if(!a) return Promise.resolve();
  sync.busy=true; setFlag("syncing");
  state.rev=Math.max(state.rev||0,sync.remoteRev||0)+1;
  var env={rev:state.rev,at:Date.now(),by:deviceId(),data:state};
  return a.put(env).then(function(){
    sync.remoteRev=env.rev; sync.dirty=false; sync.busy=false;
    saveLocal(); setFlag("synced");
  }).catch(function(e){
    sync.busy=false; setFlag("saved on this phone");
    console.warn(e);
  });
}
function pull(){
  var a=adapter(); if(!a||sync.dirty||sync.busy||ui.sheet||drag) return;
  a.get().then(function(env){
    if(!env||!env.data) return;
    sync.remoteRev=Math.max(sync.remoteRev||0,env.rev||0);
    if(env.by===deviceId()||(env.rev||0)<=(state.rev||0)) return;
    state=env.data; state.rev=env.rev; ui.undo=[];
    if(ensureLayout()) save(); else saveLocal();
    render(); setFlag("synced");
    toast("Updated from another phone");
  }).catch(function(e){ setFlag("offline"); console.warn(e); });
}
function startSync(){
  clearInterval(sync.pollTimer);
  if(!syncOn()){ setFlag("saved"); return; }
  pull();
  sync.pollTimer=setInterval(pull,7000);
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) pull(); });

/* ---------------- persistence ---------------- */
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
}
function save(){
  sync.dirty=true;
  clearTimeout(saveTimer);
  setFlag("saving");
  saveTimer=setTimeout(function(){
    saveLocal();
    if(syncOn()){ clearTimeout(sync.pushTimer); sync.pushTimer=setTimeout(pushNow,700); }
    else setFlag("saved");
  },350);
}

function load(){
  sync.cfg=loadCfg();
  var link=readLink();
  if(link&&link.state){
    var existing=lsGet(KEY);
    var msg = link.cfg
      ? "Connect this phone to the shared seating chart?"
      : "Open the shared chart? This replaces the copy saved on this device.";
    var ok = (!existing && !link.cfg) || confirm(msg);
    history.replaceState(null,"",location.pathname+location.search);
    if(ok){
      state=link.state;
      if(link.cfg) saveCfg(link.cfg);
      saveLocal();
      return;
    }
  }
  var raw=lsGet(KEY);
  if(raw){
    try{ var p=JSON.parse(raw); if(p&&p.tables){ state=p; return; } }catch(e){}
  }
  state=defaultState();
}

/* ---------------- share link ---------------- */
function packTable(t){
  return [t.name, t.seats].concat(t.people.map(function(p){ return p?(guestName(p)||""):""; }));
}
function unpackTable(a,id){
  var name=a[0], seats=a[1], names=a.slice(2,2+seats), people=[];
  while(names.length<seats) names.push("");
  return {id:id||uid("t"), name:name, seats:seats, names:names};
}
function encodePayload(withCfg){
  var sm=seatMap();
  var loose=state.guests.filter(function(g){return !sm[g.id];}).map(function(g){return g.name;});
  var L=state.layout, r1=function(v){return Math.round((+v||0)*10)/10;};
  var geo=allTables().map(function(t){ return [t.shape==="long"?1:0, r1(t.x), r1(t.y), t.rot?1:0]; });
  var lay={h:L.h, dance:{x:r1(L.dance.x),y:r1(L.dance.y),w:r1(L.dance.w),h:r1(L.dance.h)},
    marks:L.marks.map(function(m){return {id:m.id,label:m.label,x:r1(m.x),y:r1(m.y),w:r1(m.w),h:r1(m.h)};})};
  var compact=[1, packTable(state.head), state.tables.map(packTable), loose, {g:geo, L:lay}];
  var obj = withCfg ? [2, sync.cfg||null, compact] : compact;

function encodeState(){ return encodePayload(false); }
function decodeCompact(p){
  var guests=[], byName={};
  function gid(n){
    if(!n) return null;

    if(!byName[k]){ var g={id:uid("g"),name:n}; guests.push(g); byName[k]=g.id; }
    return byName[k];
  }
  function build(raw,id){
    var t=unpackTable(raw,id);
    return {id:t.id,name:t.name,seats:t.seats,people:t.names.map(function(n){return gid(n);})};
  }
  var head=build(p[1],"head");

    [head].concat(tables).forEach(function(t,i){
      var g=ex.g[i]; if(!g) return;
      if(t.id!=="head") t.shape=g[0]?"long":"round";
      t.x=g[1]; t.y=g[2]; t.rot=g[3]?1:0;

function readLink(){
  var h=location.hash.replace(/^#/,"");
  var mode=h.slice(0,2);
  if(mode!=="c="&&mode!=="b="&&mode!=="s=") return null;
  try{
    var json=decodeURIComponent(escape(atob(decodeURIComponent(h.slice(2)))));
    var p=JSON.parse(json);
    if(mode==="b=") return (p&&p.tables)?{state:p,cfg:null}:null;
    if(mode==="s=") return (p&&p[0]===2)?{state:decodeCompact(p[2]),cfg:p[1]||null}:null;
    return (p&&p[0]===1)?{state:decodeCompact(p),cfg:null}:null;

}

/* ---------------- derived ---------------- */
function allTables(){ return [state.head].concat(state.tables); }
function guestName(id){ for(var i=0;i<state.guests.length;i++) if(state.guests[i].id===id) return state.guests[i].name; return null; }
function seatMap(){
  var m={}, ts=allTables();
  for(var i=0;i<ts.length;i++) for(var j=0;j<ts[i].people.length;j++){
    var p=ts[i].people[j]; if(p) m[p]={tableId:ts[i].id, tableName:ts[i].name, idx:j};
  }
  return m;
}
function tableById(id){ var ts=allTables(); for(var i=0;i<ts.length;i++) if(ts[i].id===id) return ts[i]; return null; }

/* ---------------- mutations ---------------- */
function updateTable(id,fn){
  if(id==="head"){ state.head=fn(state.head); }
  else { state.tables=state.tables.map(function(t){return t.id===id?fn(t):t;}); }
  save();
}
function setSeatCount(id,n){
  updateTable(id,function(t){
    var people=t.people.slice(0,n);
    while(people.length<n) people.push(null);
    return Object.assign({},t,{seats:n,people:people});
  });
}
function clearSeat(id,idx){
  updateTable(id,function(t){ var p=t.people.slice(); p[idx]=null; return Object.assign({},t,{people:p}); });
}
function assign(tableId,idx,gid){
  function strip(t){ return Object.assign({},t,{people:t.people.map(function(p){return p===gid?null:p;})}); }
  function place(t){ var p=t.people.slice(); p[idx]=gid; return Object.assign({},t,{people:p}); }
  state.head = tableId==="head" ? place(strip(state.head)) : strip(state.head);
  state.tables = state.tables.map(function(t){ return t.id===tableId ? place(strip(t)) : strip(t); });
  save();
}
function addGuests(names){
  var have={}; state.guests.forEach(function(g){have[g.name.toLowerCase()]=1;});
  var added=0;
  names.forEach(function(n){ if(!have[n.toLowerCase()]){ state.guests.push({id:uid("g"),name:n}); have[n.toLowerCase()]=1; added++; } });
  save(); return added;
}
function addOneGuest(name){ var g={id:uid("g"),name:name}; state.guests.push(g); save(); return g.id; }
function removeGuest(id){
  state.guests=state.guests.filter(function(g){return g.id!==id;});
  state.head.people=state.head.people.map(function(p){return p===id?null:p;});
  state.tables=state.tables.map(function(t){return Object.assign({},t,{people:t.people.map(function(p){return p===id?null:p;})});});
  save();
}

function resized(t,n){ var p=t.people.slice(0,n); while(p.length<n) p.push(null); return Object.assign({},t,{seats:n,people:p}); }
function markById(id){ var m=state.layout.marks; for(var i=0;i<m.length;i++) if(m[i].id===id) return m[i]; return null; }
function pushUndo(){ ui.undo.push(JSON.stringify(state)); if(ui.undo.length>40) ui.undo.shift(); }

/* ---------------- layout + geometry ----------------
   The room is 100 units wide and layout.h units long. Every item stores its
   center (x,y) in those units; the page draws them in cqw, so 1 unit = 1% of width. */
var M=3;
function shapeOf(t){ return t.id==="head"?"long":(t.shape==="long"?"long":"round"); }
function seatRange(t){
  if(t.id==="head") return [HEAD_MIN,HEAD_MAX];
  return shapeOf(t)==="long"?[LONG_MIN,LONG_MAX]:[MIN_SEATS,MAX_SEATS];
}
function geom(t){
  var n=t.seats, pips=[], i;
  if(shapeOf(t)==="round"){
    for(i=0;i<n;i++){ var a=(i/n)*Math.PI*2-Math.PI/2; pips.push({x:6+Math.cos(a)*5,y:6+Math.sin(a)*5}); }
    return {w:12,h:12,body:{x:2,y:2,w:8,h:8},pips:pips,col:true};
  }
  /* long table: seats split across both long sides; the head table seats one side, facing the room */
  var one=t.id==="head", top=one?n:Math.ceil(n/2), bot=n-top;
  var len=Math.max(top,2)*4+1.5, dep=one?4.2:5, m=2.6;
  var w=len+1, h=one?(m+dep+.6):(m*2+dep);
  var body={x:.5,y:m,w:len,h:dep};
  for(i=0;i<top;i++) pips.push({x:.5+len*(i+.5)/top,y:m/2});
  for(i=0;i<bot;i++) pips.push({x:.5+len*(i+.5)/bot,y:m+dep+m/2});
  if(t.rot) return {w:h,h:w,body:{x:body.y,y:body.x,w:body.h,h:body.w},
    pips:pips.map(function(p){return {x:p.y,y:p.x};}),col:true};
  return {w:w,h:h,body:body,pips:pips,col:false};
}
function dimsOf(kind,o){ if(kind==="t"){ var g=geom(o); return {w:g.w,h:g.h}; } return {w:o.w,h:o.h}; }
function rectOf(id,x,y,d){ return {id:id,x0:x-d.w/2,y0:y-d.h/2,x1:x+d.w/2,y1:y+d.h/2}; }
function rectsAll(skip){
  var out=[], L=state.layout;
  allTables().forEach(function(t){
    if(t===skip||typeof t.x!=="number") return;
    out.push(rectOf(t.id,t.x,t.y,dimsOf("t",t)));
  });
  if(L.dance!==skip) out.push(rectOf("dance",L.dance.x,L.dance.y,L.dance));
  L.marks.forEach(function(m){ if(m!==skip&&typeof m.x==="number") out.push(rectOf(m.id,m.x,m.y,m)); });
  return out;
}
function hits(a,b,pad){ return a.x0<b.x1+pad && b.x0<a.x1+pad && a.y0<b.y1+pad && b.y0<a.y1+pad; }
function clashes(){
  var r=rectsAll(null), c={};
  for(var i=0;i<r.length;i++) for(var j=i+1;j<r.length;j++)
    if(hits(r[i],r[j],-0.4)){ c[r[i].id]=1; c[r[j].id]=1; }
  return c;
}
function ceil5(v){ return Math.ceil(v/5)*5; }
function clampObj(kind,o){
  var d=dimsOf(kind,o), H=state.layout.h;
  o.x=Math.min(Math.max(o.x,d.w/2),Math.max(d.w/2,100-d.w/2));
  o.y=Math.min(Math.max(o.y,d.h/2),Math.max(d.h/2,H-d.h/2));
}
function clampAll(){
  allTables().forEach(function(t){ clampObj("t",t); });
  clampObj("x",state.layout.dance);
  state.layout.marks.forEach(function(m){ clampObj("x",m); });
}
function maxBottom(){ return rectsAll(null).reduce(function(s,r){ return Math.max(s,r.y1); },0); }
/* drop an item into the first open spot, scanning top-left to bottom-right; grow the room if it is full */
function placeFree(o,kind){
  kind=kind||"t";
  var L=state.layout, d=dimsOf(kind,o), others=rectsAll(o), x, y;
  for(y=d.h/2+1; y<=L.h-d.h/2-1; y+=1){
    for(x=d.w/2+1; x<=100-d.w/2-1; x+=1){
      var r=rectOf("",x,y,d), ok=true;
      for(var i=0;i<others.length;i++) if(hits(r,others[i],1.2)){ ok=false; break; }
      if(ok){ o.x=x; o.y=y; return; }
    }
  }
  o.x=50; o.y=L.h+d.h/2+2; L.h=ceil5(L.h+d.h+4);

/* ---- preset layouts ---- */
function fp(t){ return dimsOf("t",t); }
function flow(list,x0,x1,y0,gap){
  var rows=[], cur=[], cw=0;
  list.forEach(function(t){
    var d=fp(t);
    if(cur.length && cw+gap+d.w > x1-x0){ rows.push(cur); cur=[]; cw=0; }
    cw+=(cur.length?gap:0)+d.w; cur.push(t);
  });
  if(cur.length) rows.push(cur);
  var y=y0;
  rows.forEach(function(r){
    var rw=0, rh=0;
    r.forEach(function(t,i){ var d=fp(t); rw+=d.w+(i?gap:0); rh=Math.max(rh,d.h); });
    var x=x0+Math.max(0,(x1-x0)-rw)/2;
    r.forEach(function(t){ var d=fp(t); t.x=x+d.w/2; t.y=y+rh/2; x+=d.w+gap; });
    y+=rh+gap;
  });
  return rows.length? y-gap : y0;
}
function placeHead(){ var h=state.head; h.rot=0; var hd=fp(h); h.x=50; h.y=M+hd.h/2; return M+hd.h; }
function presetSides(){
  var L=state.layout, y0=placeHead()+5;
  var dw=Math.min(40,Math.max(16,L.dance.w||30)), sideW=(100-dw)/2-2*M;
  var ts=state.tables, half=Math.ceil(ts.length/2);
  var b=Math.max(flow(ts.slice(0,half),M,M+sideW,y0,2), flow(ts.slice(half),100-M-sideW,100-M,y0,2), y0+30);
  L.dance={x:50,y:(y0+b)/2,w:dw,h:b-y0};
  L.h=Math.max(50,ceil5(b+M+1));
}
function presetRows(){
  var L=state.layout, dy=placeHead()+3;
  var dw=Math.min(70,Math.max(24,L.dance.w||40)), dh=Math.min(30,Math.max(14,L.dance.h||20));
  L.dance={x:50,y:dy+dh/2,w:dw,h:dh};
  var b=flow(state.tables,M,100-M,dy+dh+5,3);
  L.h=Math.max(50,ceil5(b+M+1));
}
function presetRing(){
  var L=state.layout, ts=state.tables, top=placeHead(), m=0, need=0;
  ts.forEach(function(t){ var d=fp(t), s=Math.max(d.w,d.h); m=Math.max(m,s); need+=s+2.5; });
  var r0=need/(2*Math.PI), lim=50-m/2-M, rx, ry;
  if(r0<=lim){ rx=ry=Math.min(lim,Math.max(r0,22)); }
  else { rx=lim; ry=Math.sqrt(Math.max(2*r0*r0-rx*rx,rx*rx)); }
  /* walk the oval and drop each table at an even distance along it (sized by its footprint),
     so a tall oval doesn't crowd its ends; stretch the oval until nothing touches */
  var sizes=ts.map(function(t){ var d=fp(t); return Math.max(d.w,d.h)+2.5; });
  var tot=sizes.reduce(function(s,v){return s+v;},0)||1, N=720, cy, tries=0;
  function lay(){
    var pts=[], cum=[0], i, at=0, k=0;
    for(i=0;i<=N;i++){ var a=-Math.PI/2+i/N*Math.PI*2; pts.push([Math.cos(a)*rx,Math.sin(a)*ry]); }
    for(i=1;i<=N;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    if(cum[N]<tot) return false;
    cy=top+4+ry+m/2;
    ts.forEach(function(t,j){
      var target=(at+sizes[j]/2)/tot*cum[N]; at+=sizes[j];
      while(k<N&&cum[k+1]<target) k++;
      t.x=50+pts[k][0]; t.y=cy+pts[k][1];
    });
    var r=ts.map(function(t){ return rectOf(t.id,t.x,t.y,fp(t)); });
    for(i=0;i<r.length;i++) for(var j=i+1;j<r.length;j++) if(hits(r[i],r[j],0.5)) return false;
    return true;
  }
  while(!lay() && ++tries<30) ry*=1.06;
  /* biggest dance floor that fits inside the ring without touching a table */
  var tr=ts.map(function(t){ return rectOf(t.id,t.x,t.y,fp(t)); }), dw=2*rx, dh=2*ry, g=0;
  function free(){ var d=rectOf("d",50,cy,{w:dw,h:dh}); return !tr.some(function(r){ return hits(d,r,1.5); }); }
  while(!free() && ++g<200){ dw*=.97; dh*=.97; }
  L.dance={x:50,y:cy,w:Math.max(12,dw),h:Math.max(10,dh)};
  L.h=Math.max(50,ceil5(cy+ry+m/2+M+1));
}
function finishPreset(){
  state.layout.marks.forEach(function(mk){
    clampObj("x",mk);
    var me=rectOf(mk.id,mk.x,mk.y,mk);
    if(rectsAll(mk).some(function(r){ return hits(me,r,0); })) placeFree(mk,"x");
  });
  clampAll();
}
/* older charts (and tables added from an older copy of the app) have no positions yet */
function ensureLayout(){
  var L=state.layout, changed=false;
  if(!L||!L.dance){
    state.layout={h:100,dance:{x:50,y:50,w:30,h:40},marks:[]};
    presetSides(); return true;
  }
  if(!L.marks){ L.marks=[]; changed=true; }
  if(typeof L.h!=="number"){ L.h=100; changed=true; }
  allTables().forEach(function(t){
    if(typeof t.x!=="number"||typeof t.y!=="number"){ delete t.x; delete t.y; placeFree(t); changed=true; }
  });
  return changed;
}

/* ---------------- name parsing ---------------- */
function parseNames(raw){
  var lines=raw.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean)
    .map(function(l){return l.replace(/^\s*(\d+[.)]|[-•*])\s+/,"");});
  var withComma=lines.filter(function(l){return l.indexOf(",")>-1;}).length;
  var csv = lines.length>1 && withComma >= lines.length*0.7;
  var out=lines.map(function(l){
    if(!csv) return l;
    var c=l.split(",").map(function(x){return x.trim().replace(/^"|"$/g,"");});
    return ((c[0]||"")+" "+(c[1]||"")).trim();
  });
  if(out.length && /^(first\s*name|name|guest|full\s*name)\b/i.test(out[0])) out=out.slice(1);
  var seen={},res=[];
  out.forEach(function(n){
    n=n.replace(/\s+/g," ").trim();
    if(!n||n.length>60) return;
    var k=n.toLowerCase(); if(seen[k]) return; seen[k]=1; res.push(n);
  });
  return res;
}

      '<div class="btnrow"><button class="btn olive" data-act="table" data-id="'+lt.id+'">Seat guests</button>'+
      (lHead?'':'<button class="btn danger" data-act="deltable">Remove table</button>')+'</div>';
  }
  else if(s.kind==="ldance"){
    var d=state.layout.dance;
    title="Dance floor";
    body=stepperHTML("Width",Math.round(d.w),10,90,"dancew")+
      stepperHTML("Length",Math.round(d.h),8,state.layout.h,"danceh")+
      '<div class="btnrow"><button class="btn ghost" data-act="dancecenter">Center it side to side</button></div>';
  }
  else if(s.kind==="lmark"){
    var mk=markById(s.id); if(!mk){ ui.sheet=null; host.innerHTML=""; return; }
    title="Label";
    body='<input class="field" id="mlabel" value="'+esc(mk.label)+'" placeholder="Bar, DJ, Cake…" style="margin-bottom:12px">'+
      stepperHTML("Width",Math.round(mk.w),4,60,"markw")+
      stepperHTML("Length",Math.round(mk.h),3,60,"markh")+
      '<div class="btnrow"><button class="btn danger" data-act="delmark">Remove label</button></div>';
  }
  else if(s.kind==="addmark"){
    title="Add a label";
    body='<p class="hint">Mark the other things in the room so the seating makes sense around them.</p><div class="plist" style="max-height:none">'+
      ["Bar","DJ","Cake","Gifts","Entrance","Photo booth","Guest book","Buffet"].map(function(n){
        return '<button class="pitem" data-act="newmark" data-v="'+esc(n)+'">'+esc(n)+'</button>';
      }).join("")+
      '<button class="pitem" style="border-color:#C2603F" data-act="newmark" data-v="">Something else…</button></div>';
  }
  else if(s.kind==="arrange"){
    var aL=state.layout, minH=Math.max(40,ceil5(maxBottom()-0.01));
    title="Arrange the room";
    body=stepperHTML("Room length",aL.h,minH,240,"roomh")+
      '<p class="hint">The room is always the same width. Make it longer or shorter to match the shape of the hall.</p>'+
      '<p class="sub">Start from a layout</p><div class="plist" style="max-height:none">'+
        '<button class="pitem" data-act="preset" data-v="sides">Two sides<small>Head table up top, tables down both sides of the dance floor</small></button>'+
        '<button class="pitem" data-act="preset" data-v="ring">Around the floor<small>Tables circle the dance floor, head table above</small></button>'+
        '<button class="pitem" data-act="preset" data-v="rows">Rows<small>Dance floor up front, tables in rows behind it</small></button>'+
      '</div>'+
      '<p class="sub">Every table at once</p><div class="btnrow">'+
        '<button class="btn ghost" data-act="allshape" data-v="round">Make all round</button>'+
        '<button class="btn ghost" data-act="allshape" data-v="long">Make all long</button></div>';
  }
  else if(s.kind==="assign"){
    title="Seat "+esc(guestName(s.guestId)||"");
    body='<div class="plist">'+allTables().map(function(t){
      var open=t.people.filter(function(p){return !p;}).length;
      return '<button class="pitem" data-act="tochoose" data-id="'+t.id+'"'+(open?"":' disabled style="opacity:.35"')+'>'+
        esc(t.name)+'<small>'+(open?(open+" open seat"+(open>1?"s":"")):"Full")+'</small></button>';
    }).join("")+'</div>';
  }
  host.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" id="sheet">'+
    '<div class="grab"></div><div class="sheethdr"><span class="sname">'+title+'</span>'+right+
    '<button class="x" data-act="closesheet">✕</button></div>'+body+'</div>';
  var f=document.getElementById("psearch")||document.getElementById("tname")||document.getElementById("mlabel");
  if(f && ui.focusField){ f.focus(); if(f.setSelectionRange) f.setSelectionRange(f.value.length,f.value.length); }

function toast(m){
  var h=document.getElementById("toastHost");
  h.innerHTML='<div class="toast">'+esc(m)+'</div>';
  setTimeout(function(){h.innerHTML="";},1900);
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  var tab=e.target.closest("[data-tab]");
  if(tab){ ui.tab=tab.dataset.tab; render(); return; }
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var a=el.dataset.act, id=el.dataset.id, i=parseInt(el.dataset.i,10);

  if(a==="scrim" && e.target!==el) return;

  switch(a){
    case "table": openSheet({kind:"table",id:id}); break;
    case "scrim": case "closesheet":
      if(ui.sheet&&ui.sheet.kind==="seat"){ openSheet({kind:"table",id:ui.sheet.tableId}); }
      else { ui.sheet=null; renderSheet(); render(); }
      break;
    case "rename": ui.editingName=true; ui.focusField=true; renderSheet(); break;
    case "seats": {
      var t=tableById(ui.sheet.id), rg=seatRange(t);
      var n=Math.max(rg[0],Math.min(rg[1],t.seats+parseInt(el.dataset.d,10)));
      if(n===t.seats) break;
      var dropped=t.people.slice(n).filter(Boolean).map(function(p){return guestName(p)||"someone";});
      if(dropped.length && !confirm("Removing that seat unseats "+dropped.join(" and ")+". Continue?")) break;
      if(ui.edit) pushUndo();
      setSeatCount(t.id,n);
      var st=tableById(t.id); if(typeof st.x==="number") clampObj("t",st);
      if(dropped.length) toast(dropped.join(" and ")+" moved back to the guest list");
      render(); break;
    }

    /* ---- layout editing ---- */
    case "editlayout": ui.edit=true; ui.undo=[]; render(); break;
    case "doneedit": ui.edit=false; ui.undo=[]; render(); toast("Layout saved"); break;
    case "undo": {
      if(!ui.undo.length) break;
      var rv=state.rev; state=JSON.parse(ui.undo.pop()); state.rev=rv;
      ui.sheet=null; save(); render(); break;
    }
    case "addround": case "addlong": {
      pushUndo();
      var nt=makeTable(nextTableNum(), a==="addlong"?"long":"round");
      placeFree(nt); state.tables.push(nt);
      save(); render(); toast(nt.name+" added"); break;
    }
    case "addmarkmenu": openSheet({kind:"addmark"}); break;
    case "newmark": {
      pushUndo();
      var lab=el.dataset.v, ent=lab==="Entrance";
      var mk={id:uid("m"),label:lab||"Label",w:ent?16:12,h:ent?4:8,x:0,y:0};
      placeFree(mk,"x"); state.layout.marks.push(mk); save();
      if(lab){ ui.sheet=null; toast(lab+" added"); }
      else { ui.sheet={kind:"lmark",id:mk.id}; ui.focusField=true; }
      render(); break;
    }
    case "arrange": openSheet({kind:"arrange"}); break;
    case "preset": {
      if(!confirm("Rearrange every table into this layout? You can undo it.")) break;
      pushUndo();
      ({sides:presetSides,ring:presetRing,rows:presetRows})[el.dataset.v]();
      finishPreset(); ui.sheet=null; save(); render(); toast("Layout applied"); break;
    }
    case "allshape": {
      var to=el.dataset.v, lost=0;
      if(to==="round") state.tables.forEach(function(x){ lost+=x.people.slice(MAX_SEATS).filter(Boolean).length; });
      if(lost && !confirm("Round tables top out at "+MAX_SEATS+" seats, so "+lost+" guest"+(lost>1?"s go":" goes")+" back to the unseated list. Continue?")) break;
      pushUndo();
      state.tables=state.tables.map(function(x){
        var rr=to==="round"?[MIN_SEATS,MAX_SEATS]:[LONG_MIN,LONG_MAX];
        var y=resized(x,Math.max(rr[0],Math.min(rr[1],x.seats)));
        y.shape=to; return y;
      });
      clampAll(); save(); render();
      toast("All tables are "+to+" now. Pick a layout to space them out."); break;
    }
    case "setshape": {
      var lt=tableById(ui.sheet.id), sto=el.dataset.v;
      if(shapeOf(lt)===sto) break;
      var sr=sto==="round"?[MIN_SEATS,MAX_SEATS]:[LONG_MIN,LONG_MAX];
      var sn=Math.max(sr[0],Math.min(sr[1],lt.seats));
      var sd=lt.people.slice(sn).filter(Boolean).map(function(p){return guestName(p)||"someone";});
      if(sd.length && !confirm("Round tables seat up to "+MAX_SEATS+", so "+sd.join(" and ")+" would be unseated. Continue?")) break;
      pushUndo();
      updateTable(lt.id,function(x){ var y=resized(x,sn); y.shape=sto; return y; });
      clampObj("t",tableById(lt.id)); render(); break;
    }
    case "setrot": {
      pushUndo();
      updateTable(ui.sheet.id,function(x){ return Object.assign({},x,{rot:el.dataset.v==="1"?1:0}); });
      clampObj("t",tableById(ui.sheet.id)); render(); break;
    }
    case "deltable": {
      var dt=tableById(ui.sheet.id), sc=dt.people.filter(Boolean).length;
      if(!confirm("Remove "+dt.name+"?"+(sc?" The "+sc+" guest"+(sc>1?"s":"")+" seated there go back to the unseated list.":""))) break;
      pushUndo();
      state.tables=state.tables.filter(function(x){return x.id!==dt.id;});
      ui.sheet=null; save(); render(); toast(dt.name+" removed"); break;
    }
    case "dancew": case "danceh": {
      var dd=state.layout.dance, step=2*parseInt(el.dataset.d,10);
      pushUndo();
      if(a==="dancew") dd.w=Math.max(10,Math.min(90,Math.round(dd.w)+step));
      else dd.h=Math.max(8,Math.min(state.layout.h,Math.round(dd.h)+step));
      clampObj("x",dd); save(); render(); break;
    }
    case "dancecenter": pushUndo(); state.layout.dance.x=50; save(); render(); break;
    case "markw": case "markh": {
      var mm=markById(ui.sheet.id), ms=2*parseInt(el.dataset.d,10);
      if(!mm) break;
      pushUndo();
      if(a==="markw") mm.w=Math.max(4,Math.min(60,Math.round(mm.w)+ms));
      else mm.h=Math.max(3,Math.min(60,Math.round(mm.h)+ms));
      clampObj("x",mm); save(); render(); break;
    }
    case "delmark": {
      pushUndo();
      state.layout.marks=state.layout.marks.filter(function(x){return x.id!==ui.sheet.id;});
      ui.sheet=null; save(); render(); break;
    }
    case "roomh": {
      var RL=state.layout, mn=Math.max(40,ceil5(maxBottom()-0.01));
      var nh=Math.max(mn,Math.min(240,RL.h+5*parseInt(el.dataset.d,10)));
      if(nh===RL.h) break;
      pushUndo(); RL.h=nh; save(); render(); break;
    }
    case "seat": ui.sheet={kind:"seat",tableId:ui.sheet.id,idx:i}; ui.pickQuery=""; renderSheet(); break;
    case "clearseat": clearSeat(ui.sheet.id,i); renderSheet(); renderCounts(); break;
    case "choose": assign(ui.sheet.tableId,ui.sheet.idx,id); openSheet({kind:"table",id:ui.sheet.tableId}); renderCounts(); break;
    case "createguest": {
      var gid=addOneGuest(ui.pickQuery.trim());
      assign(ui.sheet.tableId,ui.sheet.idx,gid);
      openSheet({kind:"table",id:ui.sheet.tableId}); renderCounts(); break;
    }
    case "assign": openSheet({kind:"assign",guestId:id}); break;
    case "tochoose": {
      var tt=tableById(id), idx=tt.people.indexOf(null);
      if(idx===-1) break;
      assign(id,idx,ui.sheet.guestId); ui.sheet=null; renderSheet(); render(); toast("Seated at "+tt.name); break;
    }
    case "rmguest": removeGuest(id); document.getElementById("glist").innerHTML=guestListHTML(); renderCounts(); break;
    case "filter": ui.filter=el.dataset.v; render(); break;
    case "addone": {
      var inp=document.getElementById("newname"), v=inp.value.trim();
      if(!v) break;
      addGuests([v]); inp.value=""; render(); toast("Added "+v); break;
    }
    case "addbulk": {
      var names=parseNames(ui.raw);
      if(!names.length){ toast("Nothing to add"); break; }
      var added=addGuests(names); ui.raw=""; render(); toast("Added "+added+" guests"); break;
    }
    case "tablecount": {
      var d=parseInt(el.dataset.d,10), cur=state.tables.length, want=Math.max(1,Math.min(60,cur+d));
      if(want>cur){
        for(var k=cur;k<want;k++){ var nt2=makeTable(nextTableNum()); placeFree(nt2); state.tables.push(nt2); }
      } else {
        var gone=state.tables.slice(want), gs=gone.reduce(function(s,x){return s+x.people.filter(Boolean).length;},0);
        if(gs && !confirm("Removing "+gone.map(function(x){return x.name;}).join(", ")+" unseats "+gs+" guest"+(gs>1?"s":"")+". Continue?")) break;
        state.tables=state.tables.slice(0,want);
      }
      save(); render(); break;
    }
    case "alleight": {
      state.tables=state.tables.map(function(t){
        var p=t.people.slice(0,8); while(p.length<8) p.push(null);
        return Object.assign({},t,{seats:8,people:p});
      });
      save(); render(); toast("All tables set to 8"); break;
    }
    case "synckind": ui.syncKind=el.dataset.v; render(); break;
    case "connectsync": {
      var cfg=readSyncForm();
      var missing = cfg.kind==="github" ? (!cfg.repo||!cfg.token) : (!cfg.url||!cfg.key);
      if(missing){ syncMsg('<p class="hint" style="color:#E08B67">Fill in every field first.</p>'); break; }
      if(cfg.kind==="github" && cfg.repo.split("/").length!==2){
        syncMsg('<p class="hint" style="color:#E08B67">Repository should look like yourname/wedding-seating.</p>'); break;
      }
      syncMsg('<p class="hint">Testing the connection…</p>');
      var prev=sync.cfg;
      saveCfg(cfg);
      var a=adapter();
      a.get().then(function(env){
        if(env&&env.data){
          sync.remoteRev=env.rev||0;
          if(confirm("There is already a chart on the backend. Use it and replace what is on this phone?")){
            state=env.data; state.rev=env.rev||0; ensureLayout(); saveLocal();
          } else {
            sync.dirty=true; return pushNow();
          }
        } else {
          return pushNow();
        }
      }).then(function(){
        startSync(); render();
        syncMsg('<p class="hint" style="color:#93A473">Connected. Send her the setup link and you are both on the same chart.</p>');
      }).catch(function(e){
        saveCfg(prev||null); render();
        syncMsg('<p class="hint" style="color:#E08B67">Could not connect. '+esc(String(e.message||e))+'</p>');
      });
      break;
    }
    case "setuplink": {
      var surl=location.origin+location.pathname+location.search+"#"+encodePayload(true);
      if(navigator.share) navigator.share({title:"Seating chart setup",url:surl}).catch(function(){});
      copyText(surl,function(ok){
        syncMsg(ok?'<p class="hint" style="color:#93A473">Setup link copied. Send it to her directly.</p>'
                 :'<div class="linkbox">'+esc(surl)+'</div>');
        if(ok) toast("Setup link copied");
      });
      break;
    }
    case "disconnect": {
      if(!confirm("Disconnect this phone? The chart stays here but stops syncing.")) break;
      clearInterval(sync.pollTimer); saveCfg(null); render(); setFlag("saved"); toast("Disconnected");
      break;
    }
    case "sharelink": {
      var url=location.origin+location.pathname+location.search+"#"+encodeState();
      var out=document.getElementById("linkout");
      if(navigator.share){
        navigator.share({title:"Seating chart",url:url}).catch(function(){});
      }
      copyText(url,function(ok){
        out.innerHTML=ok?"":'<div class="linkbox">'+esc(url)+'</div><p class="hint" style="margin-top:6px">Copy failed — long-press the link above to select it.</p>';
        if(ok) toast("Share link copied");
      });
      break;
    }
    case "copylist": {
      var text=allTables().map(function(t){
        var rows=t.people.map(function(p,ix){return "  "+(ix+1)+". "+(p?(guestName(p)||""):"—");}).join("\n");
        return t.name+" ("+t.people.filter(Boolean).length+"/"+t.seats+")\n"+rows;
      }).join("\n\n");
      copyText(text,function(ok){ toast(ok?"Seating list copied":"Copy failed"); });
      break;
    }
    case "download": {
      var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      var link=document.createElement("a");
      link.href=URL.createObjectURL(blob);
      link.download="seating-chart-backup.json";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      break;
    }
    case "importbtn": document.getElementById("importfile").click(); break;
    case "clearall": {
      if(!confirm("Clear all guests and seat assignments?")) break;
      state.guests=[];
      state.head.people=state.head.people.map(function(){return null;});
      state.tables=state.tables.map(function(t){return Object.assign({},t,{people:t.people.map(function(){return null;})});});
      save(); render(); toast("Chart cleared"); break;
    }
  }
});

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="gsearch"){ ui.query=t.value; document.getElementById("glist").innerHTML=guestListHTML(); }
  else if(t.id==="psearch"){
    ui.pickQuery=t.value; ui.focusField=true; renderSheet();
  }
  else if(t.id==="mlabel" && ui.sheet && ui.sheet.kind==="lmark"){
    var mk=markById(ui.sheet.id);
    if(mk){
      mk.label=t.value; save();
      var lb=document.querySelector('.mark[data-id="'+mk.id+'"] .lbl'); if(lb) lb.textContent=t.value;
    }
  }
  else if(t.id==="bulk"){
    ui.raw=t.value;
    var p=ui.raw.trim()?parseNames(ui.raw):[];
    document.getElementById("bulkinfo").textContent = p.length?("Reading "+p.length+" names, starting with "+p.slice(0,3).join(", ")+(p.length>3?"…":"")):"";
  }
});
document.addEventListener("change",function(e){
  if(e.target.id!=="importfile") return;
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if(!p||!p.tables) throw 0;
      if(!confirm("Load this backup? It replaces the chart on this phone.")) return;
      state=p; ensureLayout(); ui.undo=[]; save(); render(); toast("Backup loaded");
    }catch(err){ toast("That file could not be read"); }
  };
  r.readAsText(f);
  e.target.value="";
});
document.addEventListener("blur",function(e){
  if(e.target.id==="tname" && ui.sheet && (ui.sheet.kind==="table"||ui.sheet.kind==="ltable")){
    var v=e.target.value.trim();
    if(v) updateTable(ui.sheet.id,function(t){return Object.assign({},t,{name:v});});
    ui.editingName=false; renderSheet(); render();
  }
},true);

/* ---------------- drag to move / resize (layout edit mode) ---------------- */
document.addEventListener("pointerdown",function(e){
  if(!ui.edit||ui.sheet||e.button>0) return;
  var el=e.target.closest("[data-drag]"); if(!el) return;
  var room=document.getElementById("room"); if(!room) return;
  var kind=el.dataset.drag, resize=/-size$/.test(kind), base=kind.replace("-size","");
  var node=resize?el.parentNode:el, id=node.dataset.id;
  var obj=base==="t"?tableById(id):base==="dance"?state.layout.dance:markById(id);
  if(!obj) return;
  var dk=base==="t"?"t":"x", d=dimsOf(dk,obj);
  drag={base:base,dk:dk,resize:resize,obj:obj,node:node,u:room.getBoundingClientRect().width/100,
    sx:e.clientX,sy:e.clientY,ox:obj.x,oy:obj.y,ow:d.w,oh:d.h,moved:false,snap:JSON.stringify(state)};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});
document.addEventListener("pointermove",function(e){
  if(!drag) return;
  var px=e.clientX-drag.sx, py=e.clientY-drag.sy;
  if(!drag.moved){
    if(Math.abs(px)+Math.abs(py)<6) return;
    drag.moved=true; drag.node.classList.add("dragging");
  }
  var dx=px/drag.u, dy=py/drag.u, o=drag.obj, H=state.layout.h;
  function sn(v){ return Math.round(v*2)/2; }
  if(drag.resize){
    var l=drag.ox-drag.ow/2, tp=drag.oy-drag.oh/2;
    var w=Math.max(4,Math.min(100-l,sn(drag.ow+dx))), h=Math.max(3,Math.min(H-tp,sn(drag.oh+dy)));
    o.w=w; o.h=h; o.x=l+w/2; o.y=tp+h/2;
    drag.node.style.width=r2(w)+"cqw"; drag.node.style.height=r2(h)+"cqw";
    var lb=drag.node.querySelector(".lbl"); if(lb) lb.className="lbl"+(h>w*1.3?" v":"");
  } else {
    o.x=sn(drag.ox+dx); o.y=sn(drag.oy+dy);
    clampObj(drag.dk,o);
    var d=dimsOf(drag.dk,o);
    drag.node.style.left=r2(o.x-d.w/2)+"cqw"; drag.node.style.top=r2(o.y-d.h/2)+"cqw";
  }
});
function endDrag(e){
  if(!drag) return;
  var d=drag; drag=null;
  if(d.moved){
    ui.undo.push(d.snap); if(ui.undo.length>40) ui.undo.shift();
    save(); render();
  } else if(e.type==="pointerup" && !d.resize){
    if(d.base==="t") openSheet({kind:"ltable",id:d.obj.id});
    else if(d.base==="dance") openSheet({kind:"ldance"});
    else openSheet({kind:"lmark",id:d.obj.id});
  }
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);

function copyText(text,cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){cb(true);},function(){fallback();});
  } else fallback();
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      var ok=document.execCommand("copy");
      document.body.removeChild(ta); cb(ok);
    }catch(e){ cb(false); }
  }
}

/* ---------------- go ---------------- */
load();
if(ensureLayout()) saveLocal();
render();
startSync();
if(!syncOn()) setFlag("saved");
</script>
</body>
</html>
